name: Build IL2CPP Reference Dylib

on:
  workflow_dispatch:
    inputs:
      game_ipa_url:
        description: '可选：原 IPA 的直链（用于自动注入并产出成品 IPA；留空则只出 dylib）'
        required: false
        default: ''
  push:
    branches: [ main ]

jobs:
  build:
    # macos-14 = Apple Silicon + Xcode 15，原生 arm64 工具链，无需交叉编译
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          echo "clang: $(xcrun -f clang)"

      - name: Build dylib
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build

          # 只编 arm64：arm64e 需要 -arch arm64e 且部分 Xcode 版本拒绝，
          # 而越狱 / TrollStore 环境下 arm64 已足够。
          # 用默认 ld64，不加 -fuse-ld=lld（Xcode clang 对 iOS 目标用 lld 常失败）。
          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -miphoneos-version-min=14.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -dynamiclib \
            -O2 \
            -Wno-unused-function \
            -Wno-deprecated-declarations \
            -install_name "@executable_path/Frameworks/Il2CppRef.dylib" \
            -framework Foundation \
            -framework UIKit \
            -o build/Il2CppRef.dylib \
            src/Il2CppRef.mm

          echo "--- result ---"
          file build/Il2CppRef.dylib
          xcrun lipo -info build/Il2CppRef.dylib
          ls -la build/

      - name: Ad-hoc sign
        run: |
          set -euo pipefail
          codesign -f -s - --timestamp=none build/Il2CppRef.dylib
          codesign -dv build/Il2CppRef.dylib 2>&1 || true

      - name: Inject into IPA (optional)
        if: ${{ github.event.inputs.game_ipa_url != '' }}
        run: |
          set -euo pipefail
          mkdir -p work
          echo "downloading IPA..."
          curl -L --retry 3 -o work/input.ipa "${{ github.event.inputs.game_ipa_url }}"
          ls -la work/

          python3 tools/inject_dylib.py \
            --ipa work/input.ipa \
            --dylib build/Il2CppRef.dylib \
            --out work/output.ipa

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: Il2CppRef-dylib
          path: build/Il2CppRef.dylib
          retention-days: 30

      - name: Upload injected IPA
        if: ${{ github.event.inputs.game_ipa_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: injected-ipa
          path: work/output.ipa
          retention-days: 7
